<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inbox — RƎ:ALYZE Admin</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page admin-manager-page admin-inbox-page">

<aside class="admin-sidebar">
  <a class="admin-brand" href="admin.html">
    <img src="assets/realyze-logo.png" alt="RƎ:ALYZE">
  </a>

  <nav>
    <a class="admin-nav-link" href="admin-news.html">News</a>
    <a class="admin-nav-link" href="admin-music.html">Music</a>
    <a class="admin-nav-link" href="admin-members.html">Members</a>
    <a class="admin-nav-link" href="admin-rule.html">Rule</a>
    <a class="admin-nav-link" href="admin-about.html">About</a>
    <a class="admin-nav-link active" href="admin-inbox.html">Inbox</a>
  </nav>

  <div class="admin-sidebar-bottom">
    <a href="admin.html">← Admin Home</a>
    <a href="index.html" target="_blank">Xem website ↗</a>
    <button id="logoutBtn" type="button">Đăng xuất</button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-top inbox-top">
    <div>
      <span>RƎ:ALYZE CMS</span>
      <h1>Inbox</h1>
      <p class="admin-page-description">
        Thư và góp ý được gửi từ website.
      </p>
    </div>

    <div class="inbox-actions">
      <span class="inbox-unread-count" id="inboxUnreadCount">0 chưa đọc</span>
      <button class="admin-secondary" id="refreshInboxBtn" type="button">Làm mới</button>
    </div>
  </header>

  <div class="cms-admin-warning" id="permissionWarning" hidden></div>

  <section class="inbox-list" id="inboxList">
    <div class="cms-loading">Loading...</div>
  </section>
</main>

<dialog class="admin-editor-modal inbox-dialog" id="letterDialog">
  <button class="admin-editor-close" id="letterClose" type="button">×</button>

  <div class="inbox-dialog-body">
    <div class="inbox-letter-meta">
      <span id="letterDialogDate"></span>
      <span id="letterDialogRead"></span>
    </div>

    <h2 id="letterDialogName">—</h2>

    <div class="inbox-letter-content" id="letterDialogContent"></div>

    <div class="inbox-dialog-actions">
      <button class="admin-danger" id="deleteLetterBtn" type="button">Xóa thư</button>
      <button class="admin-secondary" id="closeLetterBtn" type="button">Đóng</button>
    </div>
  </div>
</dialog>

<script src="admin-runtime.js"></script>
<script src="admin-inbox.js"></script>
</body>
</html>
