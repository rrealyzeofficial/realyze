<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>News Manager — RƎ:ALYZE</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page admin-manager-page" data-admin-section="news">

<aside class="admin-sidebar">
  <a class="admin-brand" href="admin.html">
    <img src="assets/realyze-logo.png" alt="RƎ:ALYZE">
  </a>

  <nav>
    <a class="admin-nav-link active" href="admin-news.html">News</a>
    <a class="admin-nav-link " href="admin-music.html">Music</a>
    <a class="admin-nav-link " href="admin-rule.html">Rule</a>
  </nav>

  <div class="admin-sidebar-bottom">
    <a href="admin.html">← Admin Home</a>
    <a href="index.html" target="_blank">Xem website ↗</a>
    <button id="logoutBtn" type="button">Đăng xuất</button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-top">
    <div>
      <span>RƎ:ALYZE CMS</span>
      <h1>News</h1>
      <p class="admin-page-description">Quản lý ảnh, tiêu đề, ngày đăng và nội dung News.</p>
    </div>
    <button class="admin-primary" id="newItemBtn" type="button">+ Thêm mới</button>
  </header>

  <div class="cms-admin-warning" id="permissionWarning" hidden></div>
  <section id="adminList" class="admin-list"></section>
</main>

<dialog id="editorModal" class="admin-editor-modal">
  <button class="admin-editor-close" id="editorClose" type="button">×</button>
  <form id="editorForm">
    <div id="editorFields"></div>
    <div class="admin-editor-actions">
      <button type="button" class="admin-danger" id="deleteBtn" hidden>Xóa</button>
      <span></span>
      <button type="button" class="admin-secondary" id="cancelEditor">Hủy</button>
      <button type="submit" class="admin-primary">Lưu</button>
    </div>
  </form>
</dialog>

<script src="admin-runtime.js"></script>
<script src="admin-page.js"></script>
</body>
</html>
